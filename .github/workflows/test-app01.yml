name: App Deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    environment: Cortex  # Connects to your Env Variables & Secrets
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          # Pulls IMAGE_FULL_NAME from Environment Variables
          docker build -t ${{ vars.IMAGE_FULL_NAME }} .
          docker save ${{ vars.IMAGE_FULL_NAME }} > nginx-image.tar

      - name: Upload Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nginx-image
          path: nginx-image.tar
          retention-days: 1

  security-check:
    needs: build
    uses: davesadiv/reusable-cortex-cli-scanner/.github/workflows/reusable-cortex-scan.yml@main
    with:
      image_name: ${{ vars.IMAGE_FULL_NAME }}
      environment_name: "Cortex"
    secrets: inherit
