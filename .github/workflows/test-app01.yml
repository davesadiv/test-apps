name: App Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:
#job
jobs:
  build:
    runs-on: ubuntu-latest
    environment: Cortex
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          # Hardcoded for reliability to prevent empty variable errors
          docker build -t us-central1-docker.pkg.dev/pcs-gcp-lab01/ew-acr/nginx:latest .
          docker save us-central1-docker.pkg.dev/pcs-gcp-lab01/ew-acr/nginx:latest > nginx-image.tar

      - name: Upload Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nginx-image
          path: nginx-image.tar
          retention-days: 1

  security-check:
    needs: build
    uses: davesadiv/reusable-cortex-cli-scanner/.github/workflows/reusable-cortex-scan.yml@main
    with:
      # Explicitly passing the image string to the reusable workflow
      image_name: "us-central1-docker.pkg.dev/pcs-gcp-lab01/ew-acr/nginx:latest"
      environment_name: "Cortex"
    secrets: inherit
