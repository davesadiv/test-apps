name: App Deployment

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    # Added environment here so the build job can access GCP_KEY if needed
    environment: Cortex 
    outputs:
      # Note: Ensure you actually have a step with id 'meta' if you use this output
      image_tag: "latest" 
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        # build docker image
        run: |
          docker build -t us-central1-docker.pkg.dev/pcs-gcp-lab01/ew-acr/nginx:latest \
            -f .github/workflows/Dockerfile .github/workflows/

  # Call the reusable security workflow
  security-check:
    needs: build
    # Ensure this repository and path are correct and public, or that the token has access
    uses: davesadiv/reusable-cortex-cli-scanner/.github/workflows/reusable-cortex-scan.yml@main
    with:
      image_name: "us-central1-docker.pkg.dev/pcs-gcp-lab01/ew-acr/nginx:latest"
      environment_name: "Cortex"
    secrets:
      GCP_KEY: ${{ secrets.GCP_KEY }}
      CORTEX_API_KEY: ${{ secrets.CORTEX_API_KEY }}
      CORTEX_API_KEY_ID: ${{ secrets.CORTEX_API_KEY_ID }}
