name: App Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    environment: Cortex
    outputs:
      image_tag: "latest"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Debug File Path
        run: |
          echo "Current directory: $(pwd)"
          echo "Listing .github/workflows content:"
          ls -R .github/workflows/

      - name: Build Docker Image
        run: |
          # -f points to the Dockerfile inside the subfolder
          # The final path sets the context to that same subfolder so COPY etc/ works
          docker build -t us-central1-docker.pkg.dev/pcs-gcp-lab01/ew-acr/nginx:latest \
            -f .github/workflows/Dockerfile .github/workflows/

  security-check:
    needs: build
    # Logic: {owner}/{repo}/{path}/{filename}@{ref}
    uses: davesadiv/reusable-cortex-cli-scanner/.github/workflows/reusable-cortex-scan.yml@main
    with:
      image_name: "us-central1-docker.pkg.dev/pcs-gcp-lab01/ew-acr/nginx:latest"
      environment_name: "Cortex"
    secrets: inherit
