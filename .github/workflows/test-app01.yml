name: App Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    environment: Cortex
    # Share the variable with the next job using outputs
    outputs:
      image_name: ${{ vars.IMAGE_FULL_NAME }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          # Use the variable from the 'Cortex' environment
          docker build -t ${{ vars.IMAGE_FULL_NAME }} .
          docker save ${{ vars.IMAGE_FULL_NAME }} > nginx-image.tar

      - name: Upload Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nginx-image
          path: nginx-image.tar
          retention-days: 1

  security-check:
    needs: build
    # Explicitly link this job to the 'Cortex' environment to access its variables
    environment: Cortex 
    uses: davesadiv/reusable-cortex-cli-scanner/.github/workflows/reusable-cortex-scan.yml@main
    with:
      # Use the output from the build job to be 100% sure it isn't blank
      image_name: ${{ needs.build.outputs.image_name }}
      environment_name: "Cortex"
    secrets: inherit
